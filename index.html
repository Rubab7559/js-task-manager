<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Task Management Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Task Manager</h1>
      <div class="shortcut-hints">
        <small>Shortcuts: <b>Ctrl+N</b> New | <b>Ctrl+Z</b> Undo | <b>Ctrl+Y</b> Redo</small>
      </div>
    </header>

    <!-- Top Action Bar: Search, Filter, Sort, Undo/Redo -->
    <section class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search tasks (debounced)...">
      </div>
      
      <div class="filter-sort-group">
        <select id="filterStatus">
          <option value="all">All Status</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>

        <select id="filterPriority">
          <option value="all">All Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <select id="sortBy">
          <option value="createdAt">Sort by Date Created</option>
          <option value="dueDate">Sort by Due Date</option>
          <option value="priority">Sort by Priority</option>
        </select>
      </div>

      <div class="history-controls">
        <button id="undoBtn" title="Undo (Ctrl+Z)">↺ Undo</button>
        <button id="redoBtn" title="Redo (Ctrl+Y)">↻ Redo</button>
      </div>
    </section>

    <!-- Task Creation Form -->
    <section class="form-card">
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-row">
          <input type="text" id="taskTitle" placeholder="Task title..." required>
          <select id="taskPriority" required>
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
          <input type="date" id="taskDueDate" required>
          <button type="submit" id="saveTaskBtn">Add Task</button>
        </div>
      </form>
    </section>

    <!-- Task List Area -->
    <main class="task-list-container">
      <ul id="taskList" class="task-list">
        <!-- Tasks dynamically rendered here -->
      </ul>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
